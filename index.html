<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>seisbravas</title>
    <link rel="stylesheet" href="style/pages/index.css">
</head>
<body>
    <div class="intro-container">
        <!-- video must be muted and full mobile screen avoided so browsers don't block it -->
        <video id="intro-animation" class="intro-animation" autoplay muted playsinline>
            <source src="videos/intro.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        const animation = document.getElementById('intro-animation');

        animation.addEventListener('ended', function() {
            setTimeout(() => {
                window.location.href = "/inicio.html"
            }, 250);
        });
    </script>
</body>
</html>
